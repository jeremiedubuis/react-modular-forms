name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Locked dependencies
            react: locked
          - name: React 18
            react: 18
          - name: React 19
            react: 19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select React version and matching declarations
        if: matrix.react != 'locked'
        run: pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck library and tests
        run: pnpm typecheck

      - name: Build package
        run: pnpm build

      - name: Check public declarations as a consumer
        run: pnpm test:types
